name: Refresh Certification Manifests

on:
  push:
    branches:
      - manifest-refresh-helper
    paths:
      - '.github/workflows/refresh-target-manifests.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          ref: certify-validator-fixed
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Refresh canonical manifests
        shell: bash
        run: |
          set -euo pipefail
          npm run refresh:manifests
          git diff -- SOURCE_MANIFEST.tsv INTEGRITY.sha256

      - name: Commit refreshed manifests to certification branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ali Pournasseh'
          git config user.email '40251381+pournasseh@users.noreply.github.com'
          git add SOURCE_MANIFEST.tsv INTEGRITY.sha256
          if git diff --cached --quiet; then
            echo 'Manifests already current.'
            exit 0
          fi
          git commit -m 'chore: refresh source manifests'
          git push origin HEAD:certify-validator-fixed
